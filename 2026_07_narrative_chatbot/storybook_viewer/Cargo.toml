[package]
name = "storybook_viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AppLoad viewer for the narrative chatbot's picture book: plush_memory's e-ink viewer, plus reading the finished book back page by page."

[dependencies]
# The viewer engine (event protocol, handwriting, rotation), shared with plush_memory.
plush_memory_viewer = { path = "../../../plush_memory/eink-viewer" }
serde_json = "1"

[profile.release]
strip = true
lto = true
